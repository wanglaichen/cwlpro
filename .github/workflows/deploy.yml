name: "Deploy to CentOS Server"

on:
  workflow_run:
    workflows: ["Test"]  # 监听Test工作流完成
    types:
      - completed
    branches:
      - main
  push:
    tags:
      - "release*"  # 当打tag且tag以release开头时触发部署

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # 设置部署超时时间

    steps:
      - name: Download compiled binary
        uses: actions/download-artifact@v3
        with:
          name: compiled-binary
          path: ./

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass  # 安装sshpass用于密码认证

      - name: Deploy to CentOS Server
        env:
          CENTOS_USER: ${{ secrets.CSEVNAME }}  # 服务器用户名
          CENTOS_HOST: ${{ secrets.CHOSTIP }}  # 服务器IP或域名
          CENTOS_PASSWORD: ${{ secrets.CPW }}  # 服务器密码
          DEPLOY_PATH: "/home/myapp"  # 部署目标文件夹
        run: |
          echo "=== 开始部署到CentOS服务器 ==="
          
          # 设置sshpass环境变量
          export SSHPASS=$CENTOS_PASSWORD
          
          # 测试SSH连接
          sshpass -e ssh -o StrictHostKeyChecking=no $CENTOS_USER@$CENTOS_HOST "echo 'SSH连接成功'"
          
          # 在服务器上创建部署目录（如果不存在）
          sshpass -e ssh -o StrictHostKeyChecking=no $CENTOS_USER@$CENTOS_HOST "mkdir -p $DEPLOY_PATH"
          echo "已确保部署目录 $DEPLOY_PATH 存在"
          
          # 确保可执行文件有执行权限
          chmod +x ./c_demo
          
          # 上传编译好的可执行文件到服务器
          sshpass -e scp -o StrictHostKeyChecking=no ./c_demo $CENTOS_USER@$CENTOS_HOST:$DEPLOY_PATH/
          
          # 运行程序
          echo "=== 运行程序 ==="
          sshpass -e ssh -o StrictHostKeyChecking=no $CENTOS_USER@$CENTOS_HOST "cd $DEPLOY_PATH && ./c_demo"
          
          echo "=== 部署完成 ==="
