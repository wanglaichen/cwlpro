name: "Test"


on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Build
        run: |
          cd code
          g++ -o c_demo c_demo.cpp
      - name: Run
        run: |
          cd code
          ./c_demo
