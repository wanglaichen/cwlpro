name: "Build_Stable001"


on:
  push:
    branches:
      - stable_001
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 1 # 设置作业超时时间为1分钟，避免无限循环消耗资源
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl  # 安装curl用于网络测试
      - name: Build with static linking
        run: |
          cd code
          g++ -static -o release_stable001 c_demo.cpp
      - name: Run
        run: |
          cd code
          ./release_stable001
      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-binary
          path: code/release_stable001  # 上传编译好的可执行文件
