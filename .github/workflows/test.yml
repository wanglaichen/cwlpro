name: "构建 Stable001 测试版本"

on:
  push:
    branches:
      - stable_001
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 1 # 设置作业超时时间为1分钟，避免无限循环消耗资源
    steps:
      - name: 检出代码
        uses: actions/checkout@v3
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y curl  # 安装curl用于网络测试
      - name: 静态编译构建
        run: |
          cd code
          g++ -static -o release_stable001 c_demo.cpp
      - name: 运行测试
        run: |
          cd code
          ./release_stable001
      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: compiled-binary
          path: code/release_stable001  # 上传编译好的可执行文件
